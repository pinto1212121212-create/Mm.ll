<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="היומן שלנו">
<meta name="theme-color" content="#7c3aed">
<title>היומן שלנו 📖</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow-x:hidden}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#f5f3ff 0%,#ede9fe 100%);min-height:100vh;color:#1e1b4b}
button,input{font-family:inherit;border:none;background:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:14px 18px 22px}

/* ── Header ── */
.hdr{text-align:center;padding:22px 0 18px;animation:fadeUp .5s ease}
.hdr h1{font-size:30px;font-weight:900;color:#4c1d95;letter-spacing:.3px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:10px}
.hdr h1 .book-ico{display:inline-block;animation:float 3s ease-in-out infinite}
.hdr .sub{font-size:13px;color:#a78bfa;font-weight:600;letter-spacing:.8px}
.hdr .sub .heart{color:#ec4899;margin:0 4px}

/* ── Top Cards Row (Daniel + Rinat) ── */
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;animation:fadeUp .55s ease}
.pcard{border-radius:22px;padding:22px 14px 18px;cursor:pointer;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;position:relative;overflow:hidden;transition:transform .15s;box-shadow:0 8px 24px rgba(0,0,0,.08);min-height:165px}
.pcard:active{transform:scale(.97)}
.pcard::before{content:'';position:absolute;top:-40px;right:-40px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.13)}
.pcard::after{content:'';position:absolute;bottom:-30px;left:-30px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08)}
.pcard .emoji{font-size:44px;line-height:1;position:relative;z-index:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.15))}
.pcard .name{font-size:21px;font-weight:900;color:white;position:relative;z-index:1;letter-spacing:.5px}
.pcard .tag{font-size:11px;font-weight:600;color:rgba(255,255,255,.85);position:relative;z-index:1;letter-spacing:.3px}
.pcard.rinat{background:linear-gradient(145deg,#f472b6 0%,#db2777 60%,#be185d 100%)}
.pcard.daniel{background:linear-gradient(145deg,#60a5fa 0%,#2563eb 60%,#1d4ed8 100%)}

/* ── Main Diary Card ── */
.main-card{flex:1;border-radius:24px;padding:20px;cursor:pointer;border:none;background:linear-gradient(145deg,#a855f7 0%,#7c3aed 50%,#6d28d9 100%);color:white;box-shadow:0 12px 32px rgba(124,58,237,.35);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-height:280px;transition:transform .15s;animation:fadeUp .6s ease}
.main-card:active{transform:scale(.98)}
.main-card::before{content:'';position:absolute;top:-60px;left:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08)}
.main-card::after{content:'';position:absolute;bottom:-80px;right:-80px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.06)}

.main-top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:flex-start}
.main-badge{background:rgba(255,255,255,.18);backdrop-filter:blur(10px);padding:6px 12px;border-radius:14px;font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.main-big-emoji{font-size:48px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.2));animation:float 3.5s ease-in-out infinite}

.main-mid{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;justify-content:center;padding:18px 0}
.main-title{font-size:32px;font-weight:900;letter-spacing:.3px;margin-bottom:8px;line-height:1}
.main-tag{font-size:13px;opacity:.92;font-weight:600;letter-spacing:.3px;line-height:1.5}

.feats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1;margin-top:4px}
.feat{background:rgba(255,255,255,.14);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 6px;text-align:center}
.feat-ico{font-size:18px;line-height:1;margin-bottom:4px}
.feat-lbl{font-size:10px;font-weight:700;letter-spacing:.3px}

.main-cta{position:relative;z-index:1;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.3);border-radius:14px;padding:12px;text-align:center;font-size:13.5px;font-weight:800;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.3px}
.main-cta .arrow{display:inline-block;transition:transform .2s}
.main-card:active .main-cta .arrow{transform:translateX(-4px)}

/* ── Footer ── */
.ftr{text-align:center;margin-top:14px;padding:8px;font-size:10.5px;color:#a78bfa;font-weight:600;letter-spacing:.5px;animation:fadeUp .7s ease}
.ftr .divider{display:inline-block;margin:0 8px;opacity:.5}
</style>
</head>
<body>
<div id="app">
  
  <div class="hdr">
    <h1><span>היומן שלנו</span><span class="book-ico">📖</span></h1>
    <div class="sub">דניאל <span class="heart">♡</span> רינת</div>
  </div>
  
  <div class="row">
    <a href="rinat/" class="pcard rinat">
      <div class="emoji">🦄</div>
      <div class="name">רינת</div>
      <div class="tag">משימות יומיות</div>
    </a>
    <a href="daniel/" class="pcard daniel">
      <div class="emoji">👦</div>
      <div class="name">דניאל</div>
      <div class="tag">משימות יומיות</div>
    </a>
  </div>
  
  <a href="diary-rinat/" class="main-card">
    <div class="main-top">
      <div class="main-badge">✨ עסק · קליניקה</div>
      <div class="main-big-emoji">📖</div>
    </div>
    
    <div class="main-mid">
      <div class="main-title">היומן שלנו</div>
      <div class="main-tag">ניהול מלא של הקליניקה — תורים, לקוחות, הכנסות, הוצאות ויעדים</div>
    </div>
    
    <div class="feats">
      <div class="feat"><div class="feat-ico">💆‍♀️</div><div class="feat-lbl">לייזר</div></div>
      <div class="feat"><div class="feat-ico">💰</div><div class="feat-lbl">תשלומים</div></div>
      <div class="feat"><div class="feat-ico">💸</div><div class="feat-lbl">הוצאות</div></div>
      <div class="feat"><div class="feat-ico">👥</div><div class="feat-lbl">לקוחות</div></div>
      <div class="feat"><div class="feat-ico">🎯</div><div class="feat-lbl">יעדים</div></div>
      <div class="feat"><div class="feat-ico">📊</div><div class="feat-lbl">דוחות</div></div>
    </div>
    
    <div class="main-cta">
      פתח את היומן <span class="arrow">←</span>
    </div>
  </a>
  
  <div class="ftr">
    פרטי <span class="divider">·</span> מאובטח <span class="divider">·</span> מסונכרן
  </div>
  
</div>
</body>
</html>
